<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: radial-gradient(120% 120% at 50% 0%, #1b3a5b 0%, #0e1e30 60%, #08131f 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: 420px;
    height: 630px;              /* 420x630 = đúng tỉ lệ 2:3, luôn > 0 */
    max-width: 100vw;
    max-height: 100vh;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 25px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
    touch-action: none;
    cursor: pointer;
    background: linear-gradient(#4ec0f7, #cdeffb); /* fallback nếu JS lỗi */
  }
  canvas { display: block; width: 100%; height: 100%; }
  #err {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; text-align: center;
    color: #fff; font-size: 16px; padding: 24px;
    background: rgba(10, 20, 32, 0.85);
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="err">Không thể khởi động game.<br/>Hãy dùng trình duyệt hiện đại (Chrome / Edge / Firefox).</div>
  </div>

  <!-- Lối về trạm điều khiển (kho dự án) -->
  <a class="hub-back" href="index.html" title="Về trạm điều khiển (kho dự án)">⌂ <span>VỀ TRẠM ĐIỀU KHIỂN</span></a>
  <style>
  .hub-back{position:fixed;left:14px;bottom:14px;z-index:50;display:inline-block;
    padding:8px 13px;font-family:'Segoe UI',system-ui,sans-serif;font-weight:700;
    font-size:10px;letter-spacing:.16em;color:#7df9ff;text-decoration:none;white-space:nowrap;
    background:rgba(4,8,16,.78);border:1px solid rgba(125,249,255,.32);border-radius:6px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .2s}
  .hub-back:hover{color:#eefaff;border-color:#7df9ff;box-shadow:0 0 18px rgba(125,249,255,.35)}
  @media (max-width:520px){.hub-back span{display:none}.hub-back{padding:9px 11px;font-size:13px}}
  </style>

<script>
(() => {
  "use strict";

  // Nếu có lỗi bất kỳ ở mức top-level, hiển thị thông báo thay vì màn hình đen
  window.addEventListener('error', () => {
    const e = document.getElementById('err');
    if (e) e.style.display = 'flex';
  });

  const canvas = document.getElementById('game');
  const ctx = canvas && canvas.getContext('2d');
  if (!ctx) {
    const e = document.getElementById('err');
    if (e) e.style.display = 'flex';
    return;
  }

  // ---------- Internal resolution (physics uses these units) ----------
  const W = 400, H = 600;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // ---------- Tunables ----------
  const GROUND_H   = 100;
  const GRAVITY    = 1800;   // px/s^2
  const FLAP       = -425;   // px/s
  const MAX_FALL   = 730;    // px/s
  const PIPE_W     = 72;
  const PIPE_GAP   = 160;
  const PIPE_SPACE = 250;    // horizontal distance between pipes
  const BASE_SPEED = 175;    // px/s
  const MAX_SPEED  = BASE_SPEED + 130;

  // ---------- State ----------
  const ST = { READY: 0, PLAYING: 1, DEAD: 2 };
  let state = ST.READY;
  let score = 0;
  let muted = false;
  // localStorage có thể bị chặn (private mode / file://) — phải bọc try/catch
  function loadBest() { try { return +(localStorage.getItem('flappy_best') || 0); } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem('flappy_best', String(v)); } catch (e) {} }
  let best = loadBest();

  const bird = { x: 108, y: H * 0.45, vy: 0, r: 13, rot: 0, wing: 0, wingBoost: 0 };
  let pipes  = [];
  let deadTime = 0;
  let flash  = 0;      // white flash on death
  let shake  = 0;      // screen shake on death
  let groundX = 0;
  let t = 0;           // global time (s) for animations

  // ---------- Clouds (parallax) ----------
  const clouds = [];
  for (let i = 0; i < 6; i++) {
    clouds.push({
      x: Math.random() * W,
      y: 40 + Math.random() * 220,
      s: 0.6 + Math.random() * 0.9,
      v: 12 + Math.random() * 14
    });
  }

  // ---------- Audio (tiny Web Audio synth) ----------
  let ac = null;
  function beep(freq, dur, type = 'square', vol = 0.15, slide = 0) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, ac.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) { /* audio blocked */ }
  }
  const sFlap  = () => beep(560, 0.09, 'square', 0.10, 220);
  const sScore = () => { beep(880, 0.10, 'triangle', 0.16); setTimeout(() => beep(1320, 0.14, 'triangle', 0.16), 70); };
  const sHit   = () => beep(150, 0.30, 'sawtooth', 0.22, -90);

  // ---------- Helpers ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }
  function currentSpeed() { return Math.min(MAX_SPEED, BASE_SPEED + score * 2.2); }

  function newPipe(x) {
    const topM = 62, botM = GROUND_H + 56;
    const minY = topM + PIPE_GAP / 2;
    const maxY = (H - botM) - PIPE_GAP / 2;
    return { x, gapY: minY + Math.random() * (maxY - minY), passed: false };
  }

  // ---------- Game control ----------
  function reset() {
    state = ST.READY;
    bird.y = H * 0.45; bird.vy = 0; bird.rot = 0; bird.wingBoost = 0;
    pipes = [];
    score = 0;
    flash = 0; shake = 0;
  }

  function flap() {
    if (state === ST.READY) state = ST.PLAYING;
    if (state === ST.PLAYING) {
      bird.vy = FLAP;
      bird.wingBoost = 1;
      sFlap();
    }
  }

  function die() {
    if (state !== ST.PLAYING) return;
    state = ST.DEAD;
    deadTime = performance.now();
    flash = 0.8; shake = 1;
    sHit();
    if (score > best) { best = score; saveBest(best); }
  }

  // ---------- Update ----------
  function update(dt) {
    t += dt;

    // Clouds always drift
    for (const c of clouds) {
      c.x -= c.v * dt * (state === ST.PLAYING ? 1.6 : 1);
      if (c.x < -90) { c.x = W + 90; c.y = 40 + Math.random() * 220; c.s = 0.6 + Math.random() * 0.9; }
    }

    // Wing animation
    bird.wingBoost = Math.max(0, bird.wingBoost - dt * 2.2);
    bird.wing += dt * (state === ST.PLAYING ? 22 + bird.wingBoost * 14 : 7);

    if (state === ST.READY) {
      // Idle bobbing
      bird.y = H * 0.45 + Math.sin(t * 2.4) * 7;
      bird.vy = 0;
      bird.rot += ((Math.sin(t * 2.4) * -0.08) - bird.rot) * Math.min(1, dt * 10);
      groundX = (groundX - BASE_SPEED * dt) % 48;
      return;
    }

    if (state === ST.PLAYING) {
      // Physics
      bird.vy = Math.min(MAX_FALL, bird.vy + GRAVITY * dt);
      bird.y += bird.vy * dt;

      // Ceiling clamp (not fatal)
      if (bird.y < bird.r) { bird.y = bird.r; bird.vy = 0; }

      // Rotation follows velocity
      const target = bird.vy < 0 ? -0.42 : Math.min(1, bird.vy / MAX_FALL) * 1.45;
      bird.rot += (target - bird.rot) * Math.min(1, dt * (bird.vy < 0 ? 14 : 7));

      // Pipes
      const sp = currentSpeed();
      groundX = (groundX - sp * dt) % 48;

      if (pipes.length === 0) pipes.push(newPipe(W + 120));
      for (const p of pipes) p.x -= sp * dt;
      while (pipes.length && pipes[0].x + PIPE_W < -12) pipes.shift();
      const lastP = pipes[pipes.length - 1];
      if (lastP.x < W - PIPE_SPACE) pipes.push(newPipe(lastP.x + PIPE_SPACE));

      // Scoring
      for (const p of pipes) {
        if (!p.passed && p.x + PIPE_W < bird.x) { p.passed = true; score++; sScore(); }
      }

      // Collision: ground
      if (bird.y + bird.r >= H - GROUND_H) {
        bird.y = H - GROUND_H - bird.r;
        die();
      }
      // Collision: pipes
      if (state === ST.PLAYING) {
        for (const p of pipes) {
          const topH = p.gapY - PIPE_GAP / 2;
          const botY = p.gapY + PIPE_GAP / 2;
          if (
            circleRect(bird.x, bird.y, bird.r, p.x, -40, PIPE_W, topH + 40) ||
            circleRect(bird.x, bird.y, bird.r, p.x, botY, PIPE_W, H - botY)
          ) { die(); break; }
        }
      }
      return;
    }

    if (state === ST.DEAD) {
      // Bird tumbles to the ground, world frozen
      if (bird.y + bird.r < H - GROUND_H) {
        bird.vy = Math.min(MAX_FALL, bird.vy + GRAVITY * dt);
        bird.y = Math.min(H - GROUND_H - bird.r, bird.y + bird.vy * dt);
        bird.rot += (1.5 - bird.rot) * Math.min(1, dt * 6);
      }
    }

    flash = Math.max(0, flash - dt * 2.2);
    shake = Math.max(0, shake - dt * 2.5);
  }

  // ---------- Render ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
    g.addColorStop(0, '#4ec0f7');
    g.addColorStop(0.7, '#8fdcf9');
    g.addColorStop(1, '#cdeffb');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H - GROUND_H);

    // Sun
    ctx.save();
    ctx.globalAlpha = 0.9;
    const sg = ctx.createRadialGradient(W - 62, 74, 4, W - 62, 74, 34);
    sg.addColorStop(0, 'rgba(255,244,180,1)');
    sg.addColorStop(1, 'rgba(255,244,180,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(W - 62, 74, 34, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff2b0';
    ctx.beginPath(); ctx.arc(W - 62, 74, 16, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Clouds
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const c of clouds) drawCloud(c.x, c.y, c.s);
    ctx.restore();

    // Distant hills
    ctx.fillStyle = '#bfe8c9';
    ctx.beginPath();
    ctx.moveTo(0, H - GROUND_H);
    for (let x = 0; x <= W; x += 8) {
      const y = H - GROUND_H - 26 - Math.sin(x * 0.02 + 1.3) * 16 - Math.sin(x * 0.05) * 7;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H - GROUND_H);
    ctx.closePath();
    ctx.fill();
  }

  function drawCloud(x, y, s) {
    ctx.beginPath();
    ctx.arc(x, y, 16 * s, 0, Math.PI * 2);
    ctx.arc(x + 18 * s, y - 8 * s, 14 * s, 0, Math.PI * 2);
    ctx.arc(x + 36 * s, y, 16 * s, 0, Math.PI * 2);
    ctx.arc(x + 18 * s, y + 7 * s, 15 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPipes() {
    for (const p of pipes) {
      const topH = p.gapY - PIPE_GAP / 2;
      const botY = p.gapY + PIPE_GAP / 2;
      drawPipe(p.x, -40, topH + 40, true);
      drawPipe(p.x, botY, (H - GROUND_H) - botY, false);
    }
  }

  function drawPipe(x, y, h, isTop) {
    if (h <= 0) return;
    const capH = 26, capOver = 5;
    // body
    const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
    g.addColorStop(0, '#5cb338');
    g.addColorStop(0.35, '#8ee06a');
    g.addColorStop(0.55, '#74d352');
    g.addColorStop(1, '#4a9e2e');
    ctx.fillStyle = g;
    ctx.fillRect(x + 2, y, PIPE_W - 4, h);
    // shading line
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(x + 2, y, 5, h);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(x + 10, y, 6, h);
    // cap
    const capY = isTop ? y + h - capH : y;
    const cg = ctx.createLinearGradient(x - capOver, 0, x + PIPE_W + capOver, 0);
    cg.addColorStop(0, '#66c244');
    cg.addColorStop(0.5, '#a5ef82');
    cg.addColorStop(1, '#54a536');
    ctx.fillStyle = cg;
    rr(x - capOver, capY, PIPE_W + capOver * 2, capH, 5);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 2;
    rr(x - capOver, capY, PIPE_W + capOver * 2, capH, 5);
    ctx.stroke();
  }

  function drawGround() {
    const gy = H - GROUND_H;
    // dirt
    const g = ctx.createLinearGradient(0, gy, 0, H);
    g.addColorStop(0, '#dcbf8b');
    g.addColorStop(1, '#c8a06a');
    ctx.fillStyle = g;
    ctx.fillRect(0, gy, W, GROUND_H);
    // moving dirt stripes
    ctx.save();
    ctx.beginPath(); ctx.rect(0, gy + 22, W, GROUND_H - 22); ctx.clip();
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    for (let x = groundX - 48; x < W + 48; x += 48) {
      ctx.beginPath();
      ctx.moveTo(x, gy + 22);
      ctx.lineTo(x + 24, gy + 22);
      ctx.lineTo(x + 4, H);
      ctx.lineTo(x - 20, H);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    // grass
    ctx.fillStyle = '#7ed04f';
    ctx.fillRect(0, gy, W, 18);
    ctx.fillStyle = '#9be26b';
    for (let x = groundX - 48; x < W + 48; x += 24) {
      ctx.beginPath();
      ctx.moveTo(x, gy);
      ctx.lineTo(x + 12, gy);
      ctx.lineTo(x + 6, gy + 18);
      ctx.lineTo(x - 6, gy + 18);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0, gy + 18, W, 3);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    // shadow-ish outline
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(120,70,0,0.35)';
    // body
    const g = ctx.createRadialGradient(-4, -5, 2, 0, 0, bird.r + 3);
    g.addColorStop(0, '#ffe27a');
    g.addColorStop(1, '#ffc61a');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, bird.r + 2, bird.r, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // wing
    const wy = Math.sin(bird.wing) * 4;
    ctx.fillStyle = '#f5a300';
    ctx.beginPath();
    ctx.ellipse(-4, wy, 8.5, 6, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,70,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(-4, wy, 8.5, 6, -0.2, 0, Math.PI * 2);
    ctx.stroke();
    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(6.5, -4.5, 5.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2b2b2b';
    ctx.beginPath(); ctx.arc(8, -4.5, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(7, -5.5, 1, 0, Math.PI * 2); ctx.fill();
    // beak
    ctx.fillStyle = '#ff7b1c';
    ctx.beginPath();
    ctx.moveTo(10, 0.5); ctx.lineTo(21, 3.5); ctx.lineTo(10, 7.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e85d04';
    ctx.beginPath();
    ctx.moveTo(10, 4.5); ctx.lineTo(18, 5.2); ctx.lineTo(10, 7.5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function text(str, x, y, size, color, align = 'center', font = 'bold', outline = 'rgba(0,0,0,0.55)', lw = 4) {
    ctx.font = `${font} ${size}px "Segoe UI", Arial, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    if (outline) {
      ctx.lineJoin = 'round';
      ctx.strokeStyle = outline;
      ctx.lineWidth = lw;
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function drawHUD() {
    if (state !== ST.READY) {
      text(String(score), W / 2, 64, 46, '#fff', 'center', 'bold', 'rgba(0,0,0,0.45)', 6);
    }
    // mute badge
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    rr(W - 58, 12, 46, 26, 8); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '12px "Segoe UI", Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(muted ? 'TẮT ÂM (M)' : 'BẬT ÂM (M)', W - 35, 25);
    ctx.restore();
  }

  function drawReady() {
    text('FLAPPY BIRD', W / 2, 150, 40, '#fff', 'center', 'bold', 'rgba(0,0,0,0.4)', 7);
    // pulsing hint
    const a = 0.6 + Math.sin(t * 4) * 0.4;
    ctx.save();
    ctx.globalAlpha = a;
    text('Chạm hoặc nhấn SPACE để bay', W / 2, H - GROUND_H - 90, 18, '#fff', 'center', '600', 'rgba(0,0,0,0.35)', 4);
    ctx.restore();
    if (best > 0) text('Kỷ lục: ' + best, W / 2, H - GROUND_H - 130, 16, '#fff8d0', 'center', '600', 'rgba(0,0,0,0.35)', 4);
  }

  function drawMedal(cx, cy, r, score) {
    let color = null, ring = null;
    if (score >= 40)      { color = '#f4c430'; ring = '#c99a1a'; }
    else if (score >= 25) { color = '#cfd4dc'; ring = '#9aa3ad'; }
    else if (score >= 10) { color = '#cd7f32'; ring = '#9c5d1e'; }
    if (!color) {
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 3;
      ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.font = 'bold 11px "Segoe UI"';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('CHƯA CÓ', cx, cy);
      return;
    }
    const g = ctx.createRadialGradient(cx - r / 3, cy - r / 3, 2, cx, cy, r);
    g.addColorStop(0, '#fff8e0');
    g.addColorStop(0.25, color);
    g.addColorStop(1, ring);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = ring; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(cx, cy, r - 3, 0, Math.PI * 2); ctx.stroke();
    // star
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const ang = -Math.PI / 2 + i * Math.PI / 5;
      const rad = i % 2 === 0 ? r * 0.42 : r * 0.18;
      const px = cx + Math.cos(ang) * rad, py = cy + Math.sin(ang) * rad;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  }

  function drawGameOver() {
    // dim
    ctx.fillStyle = 'rgba(20,25,35,0.45)';
    ctx.fillRect(0, 0, W, H);

    const pw = 300, ph = 250, px = (W - pw) / 2, py = 150;
    // panel
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    const pg = ctx.createLinearGradient(0, py, 0, py + ph);
    pg.addColorStop(0, '#f7e9c6');
    pg.addColorStop(1, '#eeda9f');
    ctx.fillStyle = pg;
    rr(px, py, pw, ph, 16); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#b98a3e';
    ctx.lineWidth = 3;
    rr(px, py, pw, ph, 16); ctx.stroke();

    // title
    ctx.save();
    ctx.globalAlpha = Math.min(1, (performance.now() - deadTime) / 250);
    text('GAME OVER', W / 2, py + 38, 30, '#e8542f', 'center', 'bold', 'rgba(120,40,10,0.35)', 5);

    // medal
    drawMedal(px + 62, py + 120, 30, score);

    // scores
    ctx.fillStyle = '#7a5a1e';
    ctx.font = 'bold 13px "Segoe UI"';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('ĐIỂM', px + 130, py + 96);
    ctx.fillText('KỶ LỤC', px + 130, py + 140);
    ctx.font = 'bold 30px "Segoe UI"';
    ctx.fillStyle = '#3d2c07';
    ctx.fillText(String(score), px + 205, py + 96);
    ctx.fillStyle = score >= best && score > 0 ? '#c98a00' : '#3d2c07';
    ctx.fillText(String(best), px + 205, py + 140);
    if (score >= best && score > 0) {
      ctx.fillStyle = '#e8542f';
      ctx.font = 'bold 11px "Segoe UI"';
      ctx.fillText('MỚI!', px + 245, py + 132);
    }

    // restart button
    const bw = 190, bh = 46, bx = (W - bw) / 2, by = py + ph - 66;
    const pulse = 1 + Math.sin(t * 5) * 0.03;
    ctx.save();
    ctx.translate(bx + bw / 2, by + bh / 2);
    ctx.scale(pulse, pulse);
    ctx.translate(-(bx + bw / 2), -(by + bh / 2));
    const bg = ctx.createLinearGradient(0, by, 0, by + bh);
    bg.addColorStop(0, '#8ee06a');
    bg.addColorStop(1, '#5cb338');
    ctx.fillStyle = bg;
    rr(bx, by, bw, bh, 12); ctx.fill();
    ctx.strokeStyle = '#3f8a26'; ctx.lineWidth = 2.5;
    rr(bx, by, bw, bh, 12); ctx.stroke();
    text('CHƠI LẠI', W / 2, by + bh / 2 + 1, 18, '#fff', 'center', 'bold', 'rgba(0,0,0,0.3)', 4);
    ctx.restore();

    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(61,44,7,0.7)';
    ctx.font = '600 12px "Segoe UI"';
    ctx.textAlign = 'center';
    ctx.fillText('Nhấn SPACE / R hoặc chạm để chơi lại', W / 2, py + ph - 16);
    ctx.restore();
  }

  function render() {
    ctx.save();
    // screen shake
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake * 8, (Math.random() - 0.5) * shake * 8);
    }
    drawSky();
    drawPipes();
    drawGround();
    drawBird();
    drawHUD();

    if (state === ST.READY) drawReady();
    if (state === ST.DEAD) drawGameOver();

    // death flash
    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash * 0.8})`;
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }
    ctx.restore();
  }

  // ---------- Input ----------
  function onTap() {
    if (state === ST.DEAD) {
      if (performance.now() - deadTime > 450) reset();
      return;
    }
    flap();
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    onTap();
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (state === ST.DEAD) {
        if (performance.now() - deadTime > 450) reset();
      } else {
        flap();
      }
    } else if (e.code === 'KeyR') {
      reset();
    } else if (e.code === 'KeyM') {
      muted = !muted;
    }
  });

  // Prevent context menu on long press (mobile)
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- Loop ----------
  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    dt = Math.min(dt, 0.033); // clamp big frame gaps
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
